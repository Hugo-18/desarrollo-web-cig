<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina de contacto Hugo</title>
  <!-- La hoja de estilos se trabaja a partir de la sesión 3. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/scripts.js" defer></script>
</head>

<body>
  <div class="pagina">

    <header class="encabezado">
      <div class="contenedor encabezado-contenido">
        <div class="marca">
          <h1>Hugo Cifuentes</h1>
          <p>Ingeniero en Telecomunicaciones</p>
        </div>

        <nav>
          <a href="index.html">Inicio</a>
          <a href="perfil.html">Perfil</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>
    <main>
      <section class="contacto">
        <div class="titulo-seccion">
          <h2>Contacto</h2>
          <p>
            Si deseas comunicarte conmigo, completa el siguiente formulario
            y me pondré en contacto contigo.
          </p>
        </div>

        <form action="https://formsubmit.co/ajax/hugocifuentescifuentes@gmail.com" method="post" id="contacto"
          class="formulario-contacto" novalidate>

          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre">
            <p class="error" id="error-nombre"></p>
          </div>

          <div class="campo">
            <label for="correo">Correo</label>
            <input type="email" id="correo" name="correo">
            <p class="error" id="error-correo"></p>
          </div>

          <div class="campo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5"></textarea>
            <p class="error" id="error-mensaje"></p>
          </div>

          <button type="submit">Enviar</button>

          <p id="mensaje-exito" class="exito oculto"></p>

        </form>
      </section>
    </main>
    <footer class="pie-pagina">
      <div class="contenedor">
        <p>&copy; 2026 Hugo Cifuentes · Perfil Profesional</p>
      </div>
    </footer>
  </div>
</body>

</html>
