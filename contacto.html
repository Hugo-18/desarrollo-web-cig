
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina de contacto Hugo</title>
     <!-- La hoja de estilos se trabaja a partir de la sesión 3. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/estilos.css">
  <script src="js/scripts.js" defer></script>
</head>

<body>
  <div class="pagina">

   <header class="encabezado">
  <div class="contenedor encabezado-contenido">
    <div class="marca">
      <h1>Hugo Cifuentes</h1>
      <p>Ingeniero en Telecomunicaciones</p>
    </div>

    <nav>
      <a href="index.html">Inicio</a>
      <a href="perfil.html">Perfil</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </div>
</header>
   <main>
  <section class="contacto">
    <div class="titulo-seccion">
      <h2>Contacto</h2>
      <p>
        Si deseas comunicarte conmigo, completa el siguiente formulario
        y me pondré en contacto contigo.
      </p>
    </div>

    <form class="formulario-contacto">
      
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          placeholder="Escribe tu nombre"
          required>
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input 
          type="email" 
          id="correo" 
          name="correo" 
          placeholder="ejemplo@correo.com"
          required>
      </div>

      <div class="campo">
        <label for="asunto">Asunto</label>
        <input 
          type="text" 
          id="asunto" 
          name="asunto" 
          placeholder="Motivo de contacto"
          required>
      </div>

      <div class="campo">
        <label for="mensaje">Mensaje</label>
        <textarea 
          id="mensaje" 
          name="mensaje" 
          rows="6" 
          placeholder="Escribe tu mensaje"
          required></textarea>
      </div>

      <button type="submit">Enviar mensaje</button>

    </form>
  </section>
</main>
  <footer class="pie-pagina">
  <div class="contenedor">
    <p>&copy; 2026 Hugo Cifuentes · Perfil Profesional</p>
  </div>
</footer>
  </div>
</body>

</html>
